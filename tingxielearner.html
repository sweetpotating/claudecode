<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Tīngxiě Learner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Noto+Serif+SC:wght@700;900&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2C1810;
    --paper: #FFFBF2;
    --cream: #FFE8D6;
    --rust: #E63946;
    --orange: #FF7B54;
    --amber: #FFB84D;
    --maroon: #9B2226;
    --muted: #6B5444;
    --green: #86C375;
    --red: #FF7B54;
    --pink: #FFE5E0;
    --mintCorrect: #D4F1C5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at top, var(--cream) 0%, var(--paper) 50%, #FFF4E0 100%);
    min-height: 100vh;
    padding-bottom: 24px;
    overscroll-behavior: none;
  }
  button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
  input { font-family: inherit; -webkit-appearance: none; }
  input:focus { border-color: var(--rust) !important; outline: none; }
  .zh { font-family: 'Noto Serif SC', serif; font-weight: 900; }
  .display { font-family: 'Fraunces', serif; font-weight: 800; letter-spacing: -0.02em; }

  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* Layout */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255, 251, 242, 0.92);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 2px solid var(--ink);
  }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 720px; margin: 0 auto; padding: 10px 14px; gap: 10px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .logo {
    display: flex; gap: 2px; background: var(--rust); padding: 6px 9px;
    border-radius: 10px; box-shadow: 3px 3px 0 var(--ink); flex-shrink: 0;
  }
  .logo span { color: var(--paper); font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 20px; line-height: 1; }
  .title { margin: 0; font-size: 20px; line-height: 1.1; }
  .subtitle { margin: 0; font-size: 11px; color: var(--muted); font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main { max-width: 720px; margin: 0 auto; padding: 16px 14px; }

  .section { animation: fadeUp 0.3s ease; margin-bottom: 24px; }
  .section-title { font-family: 'Fraunces', serif; font-weight: 800; font-size: 18px;
    margin: 0 0 10px; letter-spacing: -0.01em; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }

  /* Buttons */
  .btn {
    border: 2.5px solid var(--ink); border-radius: 10px;
    padding: 12px 16px; font-weight: 800; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 3px 3px 0 var(--ink); min-height: 46px;
  }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-secondary { background: var(--paper); color: var(--ink); }
  .btn-sm {
    border: 2px solid var(--ink); border-radius: 9px;
    padding: 8px 12px; font-weight: 800; font-size: 13px;
    display: inline-flex; align-items: center; gap: 4px;
    box-shadow: 2px 2px 0 var(--ink); min-height: 38px;
    background: var(--ink); color: var(--paper);
  }
  .btn-icon {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
    width: 40px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 2px 2px 0 var(--ink); flex-shrink: 0; padding: 0;
  }
  .btn-icon-lg {
    background: var(--paper); border: 2.5px solid var(--ink); border-radius: 10px;
    width: 50px; height: 46px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 3px 3px 0 var(--ink); flex-shrink: 0; padding: 0;
  }
  .btn:disabled, .btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; }
  .btn-full { width: 100%; }

  /* Level grid */
  .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .level-card {
    border: 2.5px solid var(--ink); border-radius: 14px; padding: 14px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: all 0.15s ease; min-height: 96px; justify-content: center;
    background: var(--paper); color: var(--ink); box-shadow: 2px 2px 0 var(--ink);
    font-family: inherit;
  }
  .level-card.active { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .level-card.active[data-id="preschool"] { background: var(--amber); color: var(--paper); }
  .level-card.active[data-id="lower-pri"] { background: var(--orange); color: var(--paper); }
  .level-card.active[data-id="upper-pri"] { background: var(--rust); color: var(--paper); }
  .level-card.active[data-id="secondary"] { background: var(--maroon); color: var(--paper); }
  .level-card .emoji { font-size: 28px; }
  .level-card .label { font-weight: 800; font-size: 14px; line-height: 1.1; }
  .level-card .sub { font-size: 11px; opacity: 0.8; font-weight: 600; }

  /* List cards */
  .list-grid { display: flex; flex-direction: column; gap: 12px; }
  .list-card {
    background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 14px; box-shadow: 4px 4px 0 var(--ink);
    display: flex; flex-direction: column; gap: 10px;
  }
  .list-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .list-name { margin: 0; font-size: 16px; font-family: 'Fraunces', serif; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-meta { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
  .word-preview { display: flex; flex-wrap: wrap; gap: 5px; }
  .word-chip {
    background: var(--cream); border: 1.5px solid var(--ink); border-radius: 7px;
    padding: 3px 8px; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 14px;
  }
  .more-chip {
    background: var(--ink); color: var(--paper); border-radius: 7px;
    padding: 3px 8px; font-size: 11px; font-weight: 800;
  }

  /* Empty state */
  .empty {
    background: var(--paper); border: 2.5px dashed var(--ink); border-radius: 14px;
    padding: 28px 18px; text-align: center;
  }

  /* Bonus card */
  .bonus-banner {
    width: 100%; background: linear-gradient(135deg, var(--rust) 0%, var(--orange) 100%);
    color: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 16px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 4px 4px 0 var(--ink); font-family: inherit; text-align: left; gap: 10px;
  }
  .bonus-banner h3 { margin: 0 0 4px; font-size: 18px; display: flex; align-items: center; gap: 6px; }
  .bonus-banner p { margin: 0; opacity: 0.92; font-size: 13px; }

  /* Scores */
  .scores { display: flex; flex-direction: column; gap: 6px; }
  .score-row {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 9px;
    padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .score-badge {
    border: 2px solid var(--ink); border-radius: 7px;
    padding: 4px 10px; font-weight: 800; font-size: 13px; flex-shrink: 0;
  }

  /* Form */
  .form-wrap {
    background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 16px; box-shadow: 4px 4px 0 var(--ink);
    display: flex; flex-direction: column; gap: 16px;
  }
  .form-header { display: flex; align-items: center; gap: 10px; }
  .form-header h2 { margin: 0; font-size: 19px; }
  .label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; }
  .input {
    border: 2px solid var(--ink); border-radius: 8px; padding: 12px;
    font-size: 16px; background: var(--paper); width: 100%; min-height: 44px;
  }

  .add-stack { display: flex; flex-direction: column; gap: 8px; }
  .word-row {
    display: flex; gap: 10px; padding: 10px 12px;
    background: var(--paper); border: 1.5px solid var(--ink);
    border-radius: 8px; margin-bottom: 6px; align-items: center;
  }
  .word-row .hanzi-big { font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 22px; line-height: 1.1; }
  .word-row .pinyin-small { font-size: 12px; color: var(--muted); }

  .sticky-footer {
    position: sticky; bottom: 0;
    background: rgba(255, 251, 242, 0.95);
    backdrop-filter: blur(8px);
    margin: 8px -16px -16px;
    padding: 12px 16px;
    border-top: 2px solid var(--ink);
    border-radius: 0 0 12px 12px;
    display: flex; gap: 8px; align-items: center;
  }

  /* Practice / Test */
  .mini-header {
    display: flex; align-items: center; gap: 10px;
    background: var(--paper); border: 2px solid var(--ink);
    border-radius: 10px; padding: 8px 10px; margin-bottom: 12px;
  }
  .mini-header .label-text { font-weight: 800; font-size: 14px; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .progress-pill {
    font-size: 13px; color: var(--muted); font-weight: 800;
    background: var(--cream); padding: 4px 10px; border-radius: 7px;
    border: 1.5px solid var(--ink); flex-shrink: 0;
  }
  .progress-bar {
    height: 6px; background: var(--cream); border-radius: 3px;
    border: 1.5px solid var(--ink); overflow: hidden; margin-bottom: 12px;
  }
  .progress-fill { height: 100%; background: var(--rust); transition: width 0.3s ease; }

  .card-pad {
    background: var(--paper); border: 2.5px solid var(--ink); border-radius: 16px;
    padding: 16px; box-shadow: 4px 4px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .big-hanzi-btn {
    position: relative; width: 100%; aspect-ratio: 1/1; max-height: 52vh;
    background: var(--cream); border: 3px solid var(--ink);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 4px 4px 0 var(--ink); font-family: inherit;
    padding: 0;
  }
  .big-hanzi {
    font-family: 'Noto Serif SC', serif; font-weight: 900;
    font-size: clamp(72px, 28vw, 180px); line-height: 1;
  }
  .reveal-btn {
    background: var(--cream); border: 2px solid var(--ink); border-radius: 9px;
    padding: 10px 12px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; font-size: 13px; min-height: 42px; width: 100%;
  }
  .stroke-hint {
    background: var(--cream); border: 2px solid var(--ink); border-radius: 9px;
    padding: 10px 12px; width: 100%;
    display: flex; align-items: center; gap: 8px; font-size: 12px;
  }

  .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .mode-btn {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 9px;
    padding: 10px 8px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 5px; font-size: 13px; font-family: inherit; min-height: 42px;
  }
  .mode-btn.active { background: var(--ink); color: var(--paper); box-shadow: 2px 2px 0 var(--muted); }

  .test-prompt {
    margin: 0; font-size: 13px; color: var(--muted); font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .big-speak-btn {
    width: 120px; height: 120px; background: var(--rust); color: var(--paper);
    border: 3px solid var(--ink); border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 4px 4px 0 var(--ink);
    animation: pulse 2s ease-in-out infinite; font-family: inherit;
  }
  .answer-area { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .self-check {
    background: var(--cream); border: 2px solid var(--ink); border-radius: 12px;
    padding: 16px; width: 100%; text-align: center;
  }
  .self-check .big-answer {
    font-size: 52px; font-family: 'Noto Serif SC', serif;
    font-weight: 900; line-height: 1; margin: 4px 0;
  }
  .self-check-btns { display: flex; gap: 8px; margin-top: 12px; }
  .self-check-btns .mode-btn { flex: 1; }

  /* Canvas */
  .canvas-wrap { position: relative; width: 100%; }
  canvas {
    width: 100%; aspect-ratio: 1/1; border-radius: 14px;
    border: 3px solid var(--ink);
    touch-action: none; -ms-touch-action: none;
    -webkit-user-select: none; user-select: none;
    background: var(--paper); box-shadow: 3px 3px 0 var(--ink); display: block;
    overscroll-behavior: none;
  }
  .clear-btn {
    position: absolute; top: 10px; right: 10px;
    background: var(--paper); border: 2px solid var(--ink);
    border-radius: 8px; padding: 8px 12px;
    font-size: 13px; font-family: inherit; font-weight: 700;
    display: flex; align-items: center; gap: 4px; min-height: 36px;
    touch-action: manipulation;
  }

  /* Results */
  .results-card {
    background: var(--paper); border: 2.5px solid var(--ink); border-radius: 16px;
    padding: 20px; box-shadow: 4px 4px 0 var(--ink);
    text-align: center; max-width: 600px; width: 100%; margin: 0 auto;
  }
  .results-card .emoji-big { font-size: 60px; }
  .results-card h2 { margin: 4px 0; font-size: 30px; }
  .results-card .msg { font-size: 17px; color: var(--muted); margin: 0 0 18px; }
  .result-details {
    display: flex; flex-direction: column; gap: 5px;
    margin: 14px 0; max-height: 260px; overflow-y: auto;
  }
  .result-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 8px; border: 2px solid var(--ink);
  }
  .result-row.correct { background: var(--mintCorrect); }
  .result-row.wrong { background: var(--pink); }
  .result-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  /* Bonus */
  .bonus-level-row { display: flex; gap: 6px; flex-wrap: wrap; overflow-x: auto; padding-bottom: 2px; margin-bottom: 8px; }
  .chip-btn {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
    padding: 7px 12px; font-weight: 800; font-family: inherit;
    font-size: 12px; white-space: nowrap; flex-shrink: 0;
  }
  .chip-btn.active { color: var(--paper); }
  .chip-btn.active[data-id="preschool"] { background: var(--amber); }
  .chip-btn.active[data-id="lower-pri"] { background: var(--orange); }
  .chip-btn.active[data-id="upper-pri"] { background: var(--rust); }
  .chip-btn.active[data-id="secondary"] { background: var(--maroon); }

  .tab-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .tab {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 10px;
    padding: 10px 12px; font-weight: 800; font-family: inherit; font-size: 13px;
    min-height: 42px;
  }
  .tab.active { background: var(--rust); color: var(--paper); box-shadow: 2px 2px 0 var(--ink); }

  .refresh-btn {
    background: var(--cream); color: var(--ink); border: 2px solid var(--ink);
    border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: 13px;
    display: inline-flex; align-items: center; gap: 5px;
    box-shadow: 2px 2px 0 var(--ink); min-height: 38px;
    font-family: inherit; flex-shrink: 0;
  }

  .bonus-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; perspective: 1000px;
  }
  .bonus-grid.idiom-grid {
    grid-template-columns: 1fr;
  }
  .bonus-item {
    position: relative; aspect-ratio: 1/1;
    transform-style: preserve-3d; transition: transform 0.5s;
  }
  .idiom-grid .bonus-item {
    aspect-ratio: 3/1;
  }
  .bonus-item.flipped { transform: rotateY(180deg); }
  .bonus-face {
    position: absolute; inset: 0; border: 2.5px solid var(--ink); border-radius: 12px;
    padding: 10px; box-shadow: 3px 3px 0 var(--ink); backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .bonus-face.front { background: var(--paper); }
  .bonus-face.back { background: var(--cream); transform: rotateY(180deg); }
  .bonus-hanzi {
    font-family: 'Noto Serif SC', serif; font-weight: 900;
    font-size: clamp(26px, 8vw, 36px); line-height: 1.1; text-align: center;
  }
  .idiom-grid .bonus-hanzi {
    font-size: clamp(22px, 6vw, 30px);
  }
  .bonus-pinyin { font-size: 13px; color: var(--muted); text-align: center; font-weight: 700; }
  .bonus-meaning {
    font-family: 'Fraunces', serif; font-weight: 700;
    font-size: 14px; line-height: 1.35; text-align: center;
    color: var(--ink); padding: 0 6px;
  }
  .flip-hint { position: absolute; bottom: 5px; font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: 0.05em; }
  .speak-icon {
    position: absolute; top: 6px; right: 6px;
    background: var(--cream); border: 2px solid var(--ink);
    border-radius: 50%; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .speak-icon svg { width: 14px; height: 14px; }

  /* Inline icons (SVG, currentColor) */
  .ic { width: 1em; height: 1em; vertical-align: -0.15em; }
</style>
</head>

<div id="root"></div>

function lookupPinyin(hanzi) {
  if (DICTIONARY[hanzi]) return DICTIONARY[hanzi];
  const chars = Array.from(hanzi);
  const parts = chars.map(c => CHAR_PINYIN[c] || DICTIONARY[c] || '?');
  return parts.every(p => p !== '?') ? parts.join(' ') : '';
}

// ============================================================
let cachedZhVoice = null;
function refreshVoices() {
  const synth = window.speechSynthesis;
  if (!synth) return;
  const voices = synth.getVoices();
  cachedZhVoice = voices.find(v => v.lang && v.lang.startsWith('zh')) || null;
}
if (window.speechSynthesis) {
  refreshVoices();
  if (typeof window.speechSynthesis.addEventListener === 'function') {
    window.speechSynthesis.addEventListener('voiceschanged', refreshVoices);
  }
}

function speakChinese(text, rate = 0.8) {
  const synth = window.speechSynthesis;
  if (!synth) return;
  if (synth.speaking || synth.pending) synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-CN';
  utter.rate = rate;
  utter.pitch = 1;
  if (cachedZhVoice) utter.voice = cachedZhVoice;
  synth.speak(utter);
}

    ],

  },
];

const STORE_KEY = 'tingxie-store-v2';
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { lists: [...DEFAULT_LISTS], currentLevel: 'lower-pri', scores: [] };
}
let saveTimer = null;
function flushSaveStore() {
  if (saveTimer !== null) { clearTimeout(saveTimer); saveTimer = null; }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.store)); } catch (e) {}
}
function saveStore() {
  if (saveTimer !== null) return;
  saveTimer = setTimeout(() => { saveTimer = null; flushSaveStore(); }, 200);
}
window.addEventListener('pagehide', flushSaveStore);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSaveStore();
});

const state = {
  store: loadStore(),
  view: 'home',
  activeListId: null,
  editingListId: null,
  // form
  formName: '',
  formWords: [],
  formHanzi: '',
  // practice
  pIdx: 0,
  pShowPin: false,
  // test
  tIdx: 0,
  tMode: 'draw',
  tOrder: [],
  tResults: [],
  tShowAnswer: false,
  // results
  lastScore: null,
  // bonus
  bonusTab: 'words',
  bonusSeed: 0,
  bonusFlipped: {},
};

// Helpers
const icon = (id) => `<svg class="ic"><use href="#i-${id}"/></svg>`;
const $ = (sel) => document.querySelector(sel);
const root = document.getElementById('root');
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function navigate(view, opts = {}) {
  state.view = view;
  Object.assign(state, opts);
  if (view === 'practice') { state.pIdx = 0; state.pShowPin = false; }
  if (view === 'test') {
    state.tIdx = 0; state.tMode = 'draw'; state.tResults = []; state.tShowAnswer = false;
    const list = state.store.lists.find(l => l.id === state.activeListId);
    const order = list.words.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    state.tOrder = order;
  }
  if (view === 'addList') {
    if (state.editingListId) {
      const list = state.store.lists.find(l => l.id === state.editingListId);
      state.formName = list.name;
      state.formWords = [...list.words];
    } else {
      state.formName = `Week of ${new Date().toLocaleDateString()}`;
      state.formWords = [];
    }
    state.formHanzi = '';
  }
  render();
}

// ============================================================
// Render
// ============================================================
let renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderNow(); });
}
function renderNow() {
  // Tear down any canvas listeners from previous render before destroying DOM
  if (canvasState.cleanup) {
    canvasState.cleanup();
    canvasState.cleanup = null;
  }
  const level = LEVELS_BY_ID.get(state.store.currentLevel) || LEVELS[1];
  root.innerHTML = `
    <header>
      <div class="header-inner">
        <div class="header-left">
          <div class="logo"><span>听</span><span>写</span></div>
          <div style="min-width:0">
            <h1 class="title display">Tīngxiě</h1>
            <p class="subtitle">${level.emoji} ${level.label}</p>
          </div>
        </div>
        ${state.view !== 'home' ? `<button class="btn-icon" data-action="home" aria-label="Home">${icon('home')}</button>` : ''}
      </div>
    </header>
    <main>${renderMain()}</main>
  `;
  bindEvents();
  if (state.view === 'test' && state.tMode === 'draw') initCanvas();
}

function renderMain() {
  switch (state.view) {
    case 'home': return renderHome();
    case 'addList': return renderAddList();
    case 'practice': return renderPractice();
    case 'test': return renderTest();
    case 'results': return renderResults();
    case 'bonus': return renderBonus();
  }
}

// Patch only the self-check panel, preserving the canvas drawing

  const list = state.store.lists.find(l => l.id === state.activeListId);

function renderBonus() {

  const isIdioms = state.bonusTab === 'idioms';
  const arr = [...(isIdioms ? content.idioms : content.words)];

  const rand = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  // Show up to 12 idioms or all 20 words
  const sampled = arr.slice(0, isIdioms ? 12 : 20);

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">

        </button>

    <div class="tab-row">
      <button class="tab ${!isIdioms ? 'active' : ''}" data-action="set-tab" data-tab="words">📚 Vocabulary</button>
      <button class="tab ${isIdioms ? 'active' : ''}" data-action="set-tab" data-tab="idioms">🎋 成语 Idioms</button>
    </div>

    <div class="bonus-grid${isIdioms ? ' idiom-grid' : ''}">
      ${sampled.map((item, i) => {
        const key = `${state.store.currentLevel}-${state.bonusTab}-${state.bonusSeed}-${i}`;
        const flipped = state.bonusFlipped[key];
        const backContent = isIdioms
          ? `<div class="bonus-pinyin" style="font-size:11px;margin-bottom:4px">${escapeHtml(item.pinyin)}</div>
             <div class="bonus-meaning">${escapeHtml(item.meaning || '')}</div>`
          : `<div class="bonus-hanzi">${escapeHtml(item.hanzi)}</div>
             <div class="bonus-pinyin" style="font-size:14px;font-weight:700">${escapeHtml(item.pinyin)}</div>`;
        return `
          <div class="bonus-item ${flipped ? 'flipped' : ''}" data-action="flip-card" data-key="${key}">
            <div class="bonus-face front">
              <button class="speak-icon" data-action="speak" data-text="${escapeHtml(item.hanzi)}" data-stop="1" aria-label="Hear">${icon('volume')}</button>
              <div class="bonus-hanzi">${escapeHtml(item.hanzi)}</div>
              <div class="flip-hint">${isIdioms ? 'tap for meaning' : 'tap for pinyin'}</div>
            </div>
            <div class="bonus-face back">
              ${backContent}
              <div class="flip-hint">tap back</div>
            </div>
          </div>
        `;
      }).join('')}
    </div>

    <button class="btn btn-secondary" style="margin-top:8px;justify-content:center" data-action="refresh-bonus">${icon('refresh')} Show me different ones</button>
  `;
}

// ============================================================
// Events
// ============================================================
// Attach click delegate ONCE at startup (not on every render!)
document.body.addEventListener('click', handleClick);

function bindEvents() {
  // Input bindings need re-attaching each render since inputs are recreated
  const nameInput = $('#form-name');
  if (nameInput) {
    nameInput.addEventListener('input', e => { state.formName = e.target.value; });
  }
  const hanziInput = $('#form-hanzi');
  if (hanziInput) {
    hanziInput.addEventListener('input', e => {
      state.formHanzi = e.target.value;
      const btn = document.querySelector('[data-action="add-word"]');
      if (btn) btn.disabled = !state.formHanzi.trim();
    });
    hanziInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && state.formHanzi.trim()) addWord();
    });
  }
}

function handleClick(e) {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  if (target.dataset.stop) e.stopPropagation();

  switch (action) {
    case 'home': navigate('home'); break;
    case 'set-level': {
      state.store.currentLevel = target.dataset.id;
      saveStore();
      render();
      break;
    }
    case 'new-list':
      state.editingListId = null;
      navigate('addList');
      break;
    case 'edit-list':
      state.editingListId = target.dataset.id;
      navigate('addList');
      break;
    case 'delete-list': {
      const list = state.store.lists.find(l => l.id === target.dataset.id);
      if (list && confirm(`Delete "${list.name}"?`)) {
        state.store.lists = state.store.lists.filter(l => l.id !== target.dataset.id);
        saveStore();
        render();
      }
      break;
    }
    case 'practice':
      state.activeListId = target.dataset.id;
      navigate('practice');
      break;
    case 'test':
      state.activeListId = target.dataset.id;
      navigate('test');
      break;
    case 'bonus': navigate('bonus'); break;
    case 'cancel-form':
      state.editingListId = null;
      navigate('home');
      break;
    case 'add-word': addWord(); break;
    case 'remove-word':
      state.formWords.splice(parseInt(target.dataset.i), 1);
      render();
      break;
    case 'save-list': saveList(); break;
    case 'speak': speakChinese(target.dataset.text); break;
    case 'speak-slow': speakChinese(target.dataset.text, 0.7); break;
    case 'toggle-pinyin':
      state.pShowPin = !state.pShowPin;
      patchPracticeReveal();
      break;
    case 'prev-practice':
      if (state.pIdx > 0) { state.pIdx--; state.pShowPin = false; render(); }
      break;
    case 'next-practice': {
      const list = state.store.lists.find(l => l.id === state.activeListId);
      if (state.pIdx < list.words.length - 1) {
        state.pIdx++; state.pShowPin = false; render();
      }
      break;
    }
    case 'set-mode':
      state.tMode = target.dataset.mode;
      state.tShowAnswer = false;
      render();
      break;
    case 'clear-canvas': clearCanvas(); break;
    case 'reveal-answer':
      state.tShowAnswer = true;
      patchSelfCheck();
      break;
    case 'submit-answer': submitAnswer(target.dataset.correct === 'true'); break;
    case 'retake': navigate('test', { activeListId: state.activeListId }); break;
    case 'refresh-bonus':
      state.bonusSeed++;
      state.bonusFlipped = {};
      render();
      break;
    case 'set-tab':
      state.bonusTab = target.dataset.tab;
      state.bonusFlipped = {};
      render();
      break;
    case 'flip-card': {
      const k = target.dataset.key;
      state.bonusFlipped[k] = !state.bonusFlipped[k];
      target.classList.toggle('flipped');
      break;
    }
  }
}

function addWord() {
  const h = state.formHanzi.trim();
  if (!h) return;
  const newWord = { hanzi: h, pinyin: lookupPinyin(h) };
  state.formWords.push(newWord);
  state.formHanzi = '';

  // Patch DOM in place so the input stays focused without a setTimeout dance.
  const wrap = document.querySelector('.form-wrap');
  if (!wrap) { render(); return; }

  const input = $('#form-hanzi');
  if (input) input.value = '';
  const addBtn = wrap.querySelector('[data-action="add-word"]');
  if (addBtn) addBtn.disabled = true;
  const saveBtn = wrap.querySelector('[data-action="save-list"]');
  if (saveBtn) saveBtn.disabled = false;

  const newIndex = state.formWords.length - 1;
  const rowHtml = `<div class="word-row">
    <div style="flex:1;min-width:0">
      <div class="hanzi-big">${escapeHtml(newWord.hanzi)}</div>
      <div class="pinyin-small">${escapeHtml(newWord.pinyin || '—')}</div>
    </div>
    <button class="btn-icon" data-action="remove-word" data-i="${newIndex}" aria-label="Remove">${icon('x')}</button>
  </div>`;

  let section = wrap.querySelector('[data-words-section]');
  if (!section) {
    section = document.createElement('div');
    section.setAttribute('data-words-section', '');
    section.innerHTML = `<h3 style="margin:0 0 10px;font-size:14px"></h3>`;
    wrap.insertBefore(section, wrap.querySelector('.sticky-footer'));
  }
  section.querySelector('h3').textContent =
    `${state.formWords.length} word${state.formWords.length > 1 ? 's' : ''}`;
  section.insertAdjacentHTML('beforeend', rowHtml);

  if (input) input.focus();
}

function saveList() {
  if (state.formWords.length === 0) return;
  const list = {
    id: state.editingListId || `list-${Date.now()}`,
    name: state.formName || `Week of ${new Date().toLocaleDateString()}`,
    words: state.formWords,
    level: state.store.currentLevel,
    createdAt: new Date().toISOString(),
  };
  const exists = state.store.lists.find(l => l.id === list.id);
  if (exists) {
    state.store.lists = state.store.lists.map(l => l.id === list.id ? list : l);
  } else {
    state.store.lists.push(list);
  }
  saveStore();
  state.editingListId = null;
  navigate('home');
}

function submitAnswer(correct) {
  const list = state.store.lists.find(l => l.id === state.activeListId);
  const word = list.words[state.tOrder[state.tIdx]];
  state.tResults.push({ word: word.hanzi, pinyin: word.pinyin, correct });
  state.tShowAnswer = false;
  if (state.tIdx < state.tOrder.length - 1) {
    state.tIdx++;
    render();
  } else {
    state.lastScore = {
      listId: list.id,
      listName: list.name,
      total: state.tResults.length,
      correct: state.tResults.filter(r => r.correct).length,
      details: [...state.tResults],
    };
    state.store.scores.push({ ...state.lastScore, date: new Date().toISOString() });
    saveStore();
    state.view = 'results';
    render();
  }
}

// ============================================================
// Canvas
// ============================================================
const canvasState = { drawing: false, lastX: 0, lastY: 0, cleanup: null };

function initCanvas() {
  const canvas = document.getElementById('draw-canvas');
  if (!canvas) return;
  drawGrid(canvas);

  if (canvasState.cleanup) {
    canvasState.cleanup();
    canvasState.cleanup = null;
  }

  // Cache the 2D context — getContext('2d') is cheap but not free, and we hit it per move event.
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#2C1810';
  ctx.fillStyle = '#2C1810';

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height),
    };
  };

  const onDown = (e) => {
    e.preventDefault();
    if (typeof canvas.setPointerCapture === 'function') {
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
    canvasState.drawing = true;
    const p = getPos(e);
    canvasState.lastX = p.x;
    canvasState.lastY = p.y;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  };

  const onMove = (e) => {
    if (!canvasState.drawing) return;
    e.preventDefault();
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(canvasState.lastX, canvasState.lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    canvasState.lastX = p.x;
    canvasState.lastY = p.y;
  };

  const onUp = () => { canvasState.drawing = false; };

  // Pointer Events unify mouse + touch + pen.
  // CSS `touch-action: none` on the canvas prevents page scroll during drag, so no document-level blocker needed.
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('pointerleave', onUp);

  canvasState.cleanup = () => {
    canvas.removeEventListener('pointerdown', onDown);
    canvas.removeEventListener('pointermove', onMove);
    canvas.removeEventListener('pointerup', onUp);
    canvas.removeEventListener('pointercancel', onUp);
    canvas.removeEventListener('pointerleave', onUp);
    canvasState.drawing = false;
  };
}

function drawGrid(canvas) {
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.fillStyle = '#FFFBF2';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#F0D8B0';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.moveTo(0, 0); ctx.lineTo(canvas.width, canvas.height);
  ctx.moveTo(canvas.width, 0); ctx.lineTo(0, canvas.height);
  ctx.stroke();
  ctx.restore();
}

function clearCanvas() {
  const c = document.getElementById('draw-canvas');
  if (c) drawGrid(c);
}

// ============================================================
// Boot
// ============================================================
render();
</script>
</body>
</html>
